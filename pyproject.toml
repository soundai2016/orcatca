[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcatca"
version = "2.3.0"
description = "Controlled acoustic supervision and blocked threshold-transfer analysis"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.12,<1", "PyYAML>=6,<7", "loguru>=0.7.3,<0.8", "scikit-learn>=1.3,<2"]

[project.scripts]
orcatca = "orcatca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
